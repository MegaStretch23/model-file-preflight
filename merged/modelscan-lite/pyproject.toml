[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modelscan-lite"
version = "0.1.0"
description = "Pre-flight scanner for downloaded AI model files (pickle, PyTorch, safetensors, GGUF, Keras). Stdlib only, never unpickles."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["pickle", "safetensors", "gguf", "pytorch", "keras", "model-security", "scanner"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]

[project.urls]
Homepage = "https://github.com/MegaStretch23/modelscan-lite"

[project.scripts]
modelscan-lite = "modelscan_lite:main"

[tool.setuptools]
py-modules = ["modelscan_lite"]
